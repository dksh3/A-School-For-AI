[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "school"
version = "2.6.0"
description = "Universal agent learning and memory system"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "School Contributors" },
]
keywords = ["ai", "machine-learning", "coding-agent", "harness", "memory", "learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0,<3.0",
]

[project.scripts]
school = "school.cli:main"
school-bridge = "school.bridge:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]
web = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]
semantic = [
    "fastembed>=0.8.0",
]
mcp = [
    "mcp>=2.0",
]
ctx = [
    "tree-sitter==0.26.0",
    "tree-sitter-python==0.25.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-go==0.25.0",
    "tree-sitter-rust==0.24.2",
    "tree-sitter-java==0.23.5",
    "tree-sitter-c==0.24.2",
    "tree-sitter-cpp==0.23.4",
]
all = [
    "school[dev,web,semantic,mcp,ctx]",
]

[project.urls]
# Repository URL keeps the pre-rename GitHub repo path (remote not renamed).
Homepage = "https://github.com/dex34132-web/lerev"
Documentation = "https://github.com/dex34132-web/lerev/tree/main/docs"
Repository = "https://github.com/dex34132-web/lerev"
Issues = "https://github.com/dex34132-web/lerev/issues"

[tool.hatch.build.targets.wheel]
packages = ["core", "web", "adapters", "storage", "school", "lerev"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]
"benchmarks/**" = ["E402"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires external runtimes (node, live subprocess)"]
addopts = "-v --tb=short"
